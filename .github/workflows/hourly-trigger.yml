name: Collect Schedule Trigger

on:
  workflow_dispatch:
  schedule:
    # Hourly :17 UTC across the Kyiv daytime band: 05 UTC is Kyiv 08 in EEST
    # (UTC+3), 06 UTC is Kyiv 08 in EET (UTC+2).
    # Gate uses due Kyiv slot 08/14 with catch-up until the next slot
    # (GHA schedule lag) and skips if database/collect_slots.json already has it.
    - cron: "17 5-16 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: collect-schedule-trigger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger:
    if: vars.COLLECT_SCHEDULE_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Refresh schedule state
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- database/collect_slots.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kyiv collect-slot gate
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — gate bypassed"
            exit 0
          fi
          set +e
          output="$(python3 scripts/should_run_collect.py)"
          status=$?
          set -e
          echo "$output"
          kyiv_hour="$(printf '%s\n' "$output" | awk -F= '/^kyiv_hour=/{print $2; exit}')"
          echo "kyiv_hour=${kyiv_hour}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
            elif [ "$status" -eq 1 ]; then
            echo "skip_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "Collect schedule gate failed with exit status ${status}" >&2
            exit "$status"
          fi

      # The local catch-up agent starts slots on time only while the Mac is
      # awake; a slot still unstarted an hour later is reported, not silent.
      - name: Alert on late collect slots
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          message="$(python3 scripts/report_late_slots.py)"
          if [ -z "${message}" ]; then
            echo "No late slots"
            exit 0
          fi
          echo "::warning title=Collection schedule::${message}"
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_* missing — skip late-slot alert"
            exit 0
          fi
          text="⏰ ${message}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null

      - name: Trigger Collect iOS Jobs
        id: dispatch_collect
        if: steps.gate.outputs.skip_gate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            echo "Dispatch Collect attempt ${attempt}/${max_attempts}"
            if gh workflow run "Collect iOS Jobs" --repo "${repo}" --ref main; then
              echo "Collect iOS Jobs dispatched successfully"
              break
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to dispatch Collect iOS Jobs after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "Dispatch failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_* missing — skip failure alert"
            exit 0
          fi
          text="$(printf '⚠️ Collect Schedule Trigger failed\n%s/%s/actions/runs/%s' \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
